name: ci
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: "Sync dependencies (dev group: ruff, pytest, psutil)"
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src/ tests/ demo.py

      - name: Format check
        run: uv run ruff format --check src/ tests/ demo.py

      - name: Markdown lint
        run: uv run pymarkdownlnt --config .pymarkdown scan -r README.md docs CONTRIBUTING.md CODE_OF_CONDUCT.md

      - name: Dependency audit
        run: uv run --with pip-audit pip-audit

      - name: Unit tests
        run: uv run -m quranmedialib.check test --unit